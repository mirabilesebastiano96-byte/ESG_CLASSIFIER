[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "esg-pillar-classifier"
version = "0.1.0"
description = "Estrazione, etichettatura debole (topic ESRS) e classificazione di frasi ESG in pilastri Environmental/Social/Governance."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Sebastiano Mirabile" }
]
keywords = ["ESG", "ESRS", "NLP", "sustainability", "text classification"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# --- dipendenze core: solo cio' che serve a etichettatura/pulizia/config ---
dependencies = [
    "pandas>=1.5",
    "numpy>=1.23",
    "scikit-learn>=1.2",
    "nltk>=3.8",
]

# --- dipendenze opzionali: installa solo cio' che ti serve ---
[project.optional-dependencies]
extraction = ["pdfplumber>=0.10", "python-docx>=1.0"]
embeddings = ["gensim>=4.3"]
sbert = ["sentence-transformers>=2.2"]
classical = ["xgboost>=2.0", "lightgbm>=4.0"]
elmo = ["simple_elmo>=0.9", "tensorflow>=2.10"]
torch = ["torch>=2.0"]
transformers = ["transformers>=4.30", "torch>=2.0"]
tool = ["gradio>=4.0"]
viz = ["matplotlib>=3.6", "wordcloud>=1.9", "pillow<12"]
lang = ["langdetect>=1.0"]
dev = ["pytest>=7.0", "build>=1.0", "twine>=4.0"]
all = [
    "esg-pillar-classifier[extraction,embeddings,sbert,classical,torch,transformers,tool,viz,lang]",
]

[project.urls]
Homepage = "https://github.com/YOUR-USERNAME/esg-pillar-classifier"
Repository = "https://github.com/YOUR-USERNAME/esg-pillar-classifier"

[project.scripts]
esgpillar-extract = "esgpillar.cli:extract_cli"
esgpillar-classify = "esgpillar.cli:classify_cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
esgpillar = ["py.typed"]
